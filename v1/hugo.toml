baseURL = "https://blog.n0rdb4hnh0f.com/"
locale = "ja-jp"
defaultContentLanguage = "ja"
title = "Nordbahnhof"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
paginate = 10

[outputs]
    home = ["HTML", "RSS", "JSON"] # 検索に必須

[params]
    env = "production"
    title = "Nordbahnhof"
    description = "Nordbahnhofのブログ"

    # --- UI / UX ---
    defaultTheme = "auto"
    disableThemeToggle = false

    ShowReadingTime = true
    ShowWordCount = true
    ShowShareButtons = true
    ShowCodeCopyButtons = true
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowToc = true
    UseHugoToc = true

    ShowRssButtonInSectionTermList = true

    # --- トップページ ---
    [params.homeInfoParams]
        Title = "Nordbahnhofのページ。 🚉"
        Content = "Willkommen, Mach es dir gemütlich!"

    # --- SNS ---
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/n0rdb4hnh0f/"

    [[params.socialIcons]]
        name = "bluesky"
        url = "https://bsky.app/profile/n0rdb4hnh0f.bsky.social"

    [[params.socialIcons]]
        name = "discord"
        url =  "https://discord.com/users/1487291192663212153"

    [[params.socialIcons]]
        name = "x"
        url = "https://x.com/N0rdb4hnh0f"

    [[params.socialIcons]]
        name = "instagram"
        url = "https://www.instagram.com/n0rdb4hnh0f/"

    [[params.socialIcons]]
        name = "simplex"
        url = "https://smp12.simplex.im/a#dXSs464VjtgrI17wMGbEyw_GA662UszTftIh_w89hbo"


    [[params.socialIcons]]
        name = "misskey"
        url = "https://misskey.io/@N0rdb4hnh0f"


    # --- OGP ---
    images = ["images/default-cover.jpg"]

    # --- favicon ---
    [params.assets]
        favicon = "/favicon.ico"
        favicon16x16 = "/img/favicon-16x16.png"
        favicon32x32 = "/img/favicon-32x32.png"

    # --- 記事制御 ---
    mainSections = ["posts"]

# --- メニュー ---
[[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10

[[menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "/archives/"
    weight = 20

[[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

[[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 40
